[meta]
metro = "seattle"
db_path = "db/deals.db"
user_agent = "FreeMapSeattle/1.0 (contact: freemap@example.com)"
# places_brand and chains produce geocoded map pins; slickdeals/local are
# primarily list deals. Reddit is live but may be rate-limited by source IP.
sources_enabled = ["places_brand", "chains", "slickdeals", "local", "reddit"]

[freshness]
stale_after_hours = 24

# Source-health baseline for `python -m scrapers.health` (run post-scrape in CI).
# `expected` sources MUST have a latest scrape_runs row that neither errored nor
# found 0 deals, or the check exits non-zero. `optional` sources are reported but
# do not fail the workflow; Reddit belongs there because a live IP may be
# rate-limited even though its browser-UA fetch path is functional.
[health]
expected = ["places_brand", "chains", "slickdeals", "local"]
optional = ["reddit"]

[geocoder]
# provider: "census" (keyless US Census geocoder, the default — works unattended)
#         | "google" (uses GOOGLE_MAPS_API_KEY env) | "nominatim" (OSM; public
#           endpoint now 403s server traffic, kept for local/dev only).
provider = "census"
min_interval_seconds = 1.0
max_live_calls = 200

[sources.reddit]
subreddits = ["Seattle"]
listing_urls = ["https://www.reddit.com/r/Seattle/.json"]

# chains: wired to Tom Douglas Restaurants' happy-hours page — a server-rendered
# (BentoBox) page whose robots.txt allows it and which needs no secrets. Each
# happy hour is at a named physical Seattle venue, so these surface as geocoded
# map pins (unlike the online-only slickdeals/local sources). The parser anchors
# on each venue's off-site "Visit" link; `venues` seeds precise addresses for the
# geocoder (a missing venue falls back to "<name>, Seattle, WA").
[sources.chains]
offers_urls = ["https://www.tomdouglas.com/happy-hour/"]

[sources.chains.venues]
"Half Shell" = "2020 Western Ave, Seattle, WA 98121"
"Palace Kitchen" = "2030 5th Ave, Seattle, WA 98121"
"Neb" = "316 Virginia St, Seattle, WA 98121"
"Serious Pie Downtown" = "2001 4th Ave, Seattle, WA 98121"
"Serious Pie Totem Lake" = "12540 120th Ave NE #122, Kirkland, WA 98034"

# slickdeals: wired to DealNews (server-rendered offer cards; robots.txt allows
# all but /dead-end/ with Crawl-delay: 2). Offers are online -> list view.
[sources.slickdeals]
listing_urls = ["https://www.dealnews.com/"]

# local: wired to the My Ballard neighborhood blog RSS feed (plain RSS 2.0).
# Items have no <location>, so they surface as online deals in the list view,
# not geocoded map pins.
[sources.local]
feed_urls = ["https://www.myballard.com/feed/"]

# places_brand: the source that FILLS THE MAP. Each brand's free/BOGO offer fans
# out to one physical deal per Seattle storefront, geocoded to a pin.
#   provider="config" (default, KEYLESS): storefronts are the curated `locations`
#     below — provable today with the Census geocoder, no API key.
#   provider="google": omit `locations`; storefronts are discovered via the Google
#     Places API (needs GOOGLE_MAPS_API_KEY) and the offer fans out across all of
#     them. Switch by setting provider="google" here and [geocoder].provider="google".
# Offer text is what classify() reads — keep the free/BOGO + food/retail keywords.
[sources.places_brand]
provider = "config"
metro_query = "Seattle, WA"

[[sources.places_brand.brands]]
id = "starbucks-bogo"
name = "Starbucks"
offer = "Buy one handcrafted drink, get one free (BOGO), 12-6pm"
url = "https://www.starbucks.com/rewards"
locations = [
  "102 Pike St, Seattle, WA 98101",
  "1912 Pike Pl, Seattle, WA 98101",
  "400 Occidental Ave S, Seattle, WA 98104",
  "505 5th Ave S, Seattle, WA 98104",
]

[[sources.places_brand.brands]]
id = "chipotle-freeguac"
name = "Chipotle"
offer = "Free guacamole with any entree purchase"
url = "https://www.chipotle.com/"
locations = [
  "1501 Pike Pl, Seattle, WA 98101",
  "1318 Madison St, Seattle, WA 98104",
  "4229 University Way NE, Seattle, WA 98105",
]

[[sources.places_brand.brands]]
id = "moes-bogo-burrito"
name = "MOD Pizza"
offer = "Buy one pizza get one free for rewards members (BOGO)"
url = "https://modpizza.com/"
locations = [
  "510 Westlake Ave N, Seattle, WA 98109",
  "2640 NE University Village St, Seattle, WA 98105",
]
