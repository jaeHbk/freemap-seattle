[meta]
metro = "seattle"
db_path = "db/deals.db"
user_agent = "FreeMapSeattle/1.0 (contact: freemap@example.com)"
sources_enabled = ["reddit", "chains", "slickdeals", "local"]

[freshness]
stale_after_hours = 24

[geocoder]
min_interval_seconds = 1.0
max_live_calls = 200

[sources.reddit]
subreddits = ["Seattle"]
listing_urls = ["https://www.reddit.com/r/Seattle/.json"]

# chains: wired to Tom Douglas Restaurants' happy-hours page — a server-rendered
# (BentoBox) page whose robots.txt allows it and which needs no secrets. Each
# happy hour is at a named physical Seattle venue, so these surface as geocoded
# map pins (unlike the online-only slickdeals/local sources). The parser anchors
# on each venue's off-site "Visit" link; `venues` seeds precise addresses for the
# geocoder (a missing venue falls back to "<name>, Seattle, WA").
[sources.chains]
offers_urls = ["https://www.tomdouglas.com/happy-hour/"]

[sources.chains.venues]
"Half Shell" = "2020 Western Ave, Seattle, WA 98121"
"Palace Kitchen" = "2030 5th Ave, Seattle, WA 98121"
"Neb" = "316 Virginia St, Seattle, WA 98121"
"Serious Pie Downtown" = "2001 4th Ave, Seattle, WA 98121"
"Serious Pie Totem Lake" = "12540 120th Ave NE #122, Kirkland, WA 98034"

# slickdeals: wired to DealNews (server-rendered offer cards; robots.txt allows
# all but /dead-end/ with Crawl-delay: 2). Offers are online -> list view.
[sources.slickdeals]
listing_urls = ["https://www.dealnews.com/"]

# local: wired to the My Ballard neighborhood blog RSS feed (plain RSS 2.0).
# Items have no <location>, so they surface as online deals in the list view,
# not geocoded map pins.
[sources.local]
feed_urls = ["https://www.myballard.com/feed/"]
